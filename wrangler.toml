name = "wemeditate-web"
compatibility_date = "2025-09-06"
compatibility_flags = ["nodejs_compat"]
main = "virtual:photon:cloudflare:server-entry"

# Environment Variables
#
# SECURITY: Put only non-sensitive values here. Git tracks this file.
#
# Store secrets as encrypted variables in the Cloudflare dashboard:
# Workers & Pages → wemeditate-web → Settings → Environment variables
#
# Required secrets in the Cloudflare dashboard:
# - SAHAJCLOUD_API_KEY (server-side only)
# - PUBLIC__MAPBOX_ACCESS_TOKEN (browser-accessible, but still secret)
# - PUBLIC__SENTRY_DSN (browser-accessible, but still secret)
# - SENTRY_DSN (server-side only)
#
# Build-time PUBLIC__* variables:
# - Set in .env.production (tracked in git, no secrets)
# - Vite embeds these values during the production build
# - Example: PUBLIC__SAHAJCLOUD_URL
#
# Note: [vars] in this file are runtime-only. Vite cannot read them at build
# time. Put client-visible PUBLIC__* values in .env.production instead.

[vars]
PUBLIC__SAHAJCLOUD_URL = "https://cloud.sydevelopers.com"
PUBLIC__STATUS_PAGE_URL = "https://stats.uptimerobot.com/oJ9B8UX9lA"
