# Detects drift between server/payload-types.ts and SahajCloud's live schema.
#
# `pnpm types:cms` copies the file from SahajCloud's main; nothing else notices when main moves
# and this copy does not. Main's contractSync in sydevs/claude-workflow normally opens the sync PR
# when a producer PR merges, so this is the backstop for a sync that was missed or closed.
#
# It runs on a schedule and by hand ONLY, never on pull_request: an unrelated upstream change
# must not block an ordinary PR. A red run here is the signal. It commits nothing.
name: Payload types drift

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: server/payload-types.ts vs SahajCloud main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm types:cms
      - name: Fail when the copy differs from the commit
        run: node scripts/check-payload-types-drift.mjs
