name: CI

on:
  pull_request:
  # The merge queue runs the required checks against a merge_group ref, not
  # the PR head. Without this trigger the check never reports and the queue
  # stalls forever. (why: sydevs/claude-workflow docs/why.md#github-owns-the-merge)
  merge_group:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # primary: Cloudflare posts the preview URL in a PR comment
  issues: read # needed: GitHub serves PR comments through the issues/{n}/comments endpoint
  checks: read # fallback: Cloudflare preview URL in the "Cloudflare Pages" check-run output
  deployments: read # fallback: a Workers-Builds-style deployment environment_url
  statuses: read # fallback: a preview URL posted as a commit status

jobs:
  gate:
    name: Lint, Typecheck & Unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # No `version:` input. The version comes from `packageManager` in
      # package.json. Naming it in both places makes action-setup fail.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:run # unit tests only. vitest.config.ts excludes smoke specs.

  # This repo has two Cloudflare previews per PR. The URL host tells them apart:
  #   - web   → the Vike app, Workers Builds  (…-wemeditate-web.<acct>.workers.dev)
  #   - ladle → the design system, Pages       (…wm-design.pages.dev)
  # One matrix smoke job runs per target. CF_PROJECT_MATCH selects the right one.
  smoke:
    name: Smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: web
            project: wemeditate-web
            script: test:smoke
          - target: ladle
            project: wm-design
            script: test:smoke:ladle
    steps:
      # wm-design rebuilds only when a push touches a path Ladle reads (the
      # project's build watch paths, mirrored in WATCH/IGNORE below and listed in
      # docs/cloudflare-previews-ci.md). With no build there is no preview, and
      # discovery would wait out its 12-minute timeout before skipping anyway.
      - name: Did Cloudflare build the ladle preview?
        id: scope
        if: matrix.target == 'ladle' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.action == 'synchronize' && github.event.before || github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          WATCH: '^(components|hooks|lib|layouts|assets|public|types|\.ladle|\.storybook)/|^server/(cms-types|error-utils)|^(package\.json|pnpm-lock\.yaml|tsconfig\.json|\.node-version)$'
          IGNORE: '\.(test\.tsx?|spec\.ts|md)$'
        run: |
          if ! diff=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" --jq '"\(.total_commits) \(.files | length)", .files[].filename'); then
            echo "built=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          read -r commits count <<< "$(head -n 1 <<< "$diff")"
          # Cloudflare ignores watch paths for a push of 0 files or 20+ commits.
          # 300 is the compare API's file cap, so a bigger push counts as built.
          if (( count == 0 || count >= 300 || commits >= 20 )) ||
            tail -n +2 <<< "$diff" | grep -Ev "$IGNORE" | grep -Eq "$WATCH"; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "No path Ladle reads changed in this push, so Cloudflare built no wm-design preview and there is nothing to smoke." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Skip the whole setup with install: setup-node's post step fails the job
      # when it finds no pnpm store to cache.
      - if: steps.scope.outputs.built != 'false'
        uses: actions/checkout@v7
      - if: steps.scope.outputs.built != 'false'
        uses: pnpm/action-setup@v6
      - if: steps.scope.outputs.built != 'false'
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: steps.scope.outputs.built != 'false'
        run: pnpm install --frozen-lockfile

      # Find this target's preview URL through the GitHub API. Cloudflare posts
      # it in the bot's PR comment. Check-run output and deployment data are
      # fallbacks. This step waits until the preview responds. It skips
      # gracefully when no preview is posted (for example, a forked PR
      # without permissions), so the job still passes.
      - name: Discover ${{ matrix.target }} preview URL
        id: preview
        if: steps.scope.outputs.built != 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CF_PROJECT_MATCH: ${{ matrix.project }}
        run: node scripts/get-cloudflare-preview-url.mjs

      - name: Smoke ${{ matrix.target }}
        if: ${{ steps.preview.outputs.preview_url != '' }}
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          # Web specs use this key to find a real SahajCloud page or meditation.
          # It has no effect for ladle.
          SAHAJCLOUD_API_KEY: ${{ secrets.SAHAJCLOUD_API_KEY }}
        run: pnpm ${{ matrix.script }}
