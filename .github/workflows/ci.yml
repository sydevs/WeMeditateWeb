name: CI

on: pull_request

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # primary: Cloudflare posts the preview URL in a PR comment
  issues: read # PR comments are read via the issues/{n}/comments endpoint
  checks: read # fallback: Cloudflare preview URL in the "Cloudflare Pages" check-run output
  deployments: read # fallback: a Workers-Builds-style deployment environment_url
  statuses: read # fallback: a preview URL posted as a commit status

jobs:
  gate:
    name: Lint, Typecheck & Unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:run # unit only — smoke specs are excluded in vitest.config.ts

  smoke:
    name: Smoke (Cloudflare preview)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Discover the PR's Cloudflare preview URL for the WEB APP from the GitHub
      # API and wait until it's healthy. The repo also has a Ladle design-system
      # preview (wm-design.pages.dev) which the script deliberately excludes.
      # Set the CF_PREVIEW_PROJECT repo variable to the web-app preview project's
      # name/host (e.g. "wemeditate-web") once that preview exists. Until then,
      # this finds no matching preview and the smoke step is skipped (job stays green).
      - name: Discover Cloudflare preview URL
        id: preview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CF_PROJECT_MATCH: ${{ vars.CF_PREVIEW_PROJECT }}
        run: node scripts/get-cloudflare-preview-url.mjs

      - name: Run smoke specs against the preview
        if: ${{ steps.preview.outputs.preview_url != '' }}
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          # Optional: enables deterministic meditation/page discovery. Smoke still
          # runs without it (falls back to homepage-crawled links).
          SAHAJCLOUD_API_KEY: ${{ secrets.SAHAJCLOUD_API_KEY }}
        run: pnpm test:smoke
