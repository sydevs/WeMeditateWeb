name: CI

on:
  pull_request:
  # The merge queue runs the required checks against a merge_group ref, not
  # the PR head. Without this trigger the check never reports and the queue
  # stalls forever. (why: sydevs/claude-workflow docs/why.md#github-owns-the-merge)
  merge_group:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # primary: Cloudflare posts the preview URL in a PR comment
  issues: read # needed: GitHub serves PR comments through the issues/{n}/comments endpoint
  checks: read # fallback: `Workers Builds: <worker>` posts only a dashboard details_url, never a preview
  deployments: read # fallback: a Workers-Builds-style deployment environment_url
  statuses: read # fallback: a preview URL posted as a commit status

jobs:
  gate:
    name: Lint, Typecheck & Unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # No `version:` input. The version comes from `packageManager` in
      # package.json. Naming it in both places makes action-setup fail.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:run # unit tests only. vitest.config.ts excludes smoke specs.
      - run: pnpm ladle:build # fail the gate on a broken story, and write build/ for the step below

      # Validates the design Worker's config against the pinned wrangler's own schema. Nothing
      # else in this repo reads `wrangler.design.jsonc` — Workers Builds holds the dashboard's
      # copy of the path — so without this step a rename, a typo, or an `assets.directory` that
      # drifts from what `ladle:build` writes would surface only in a Cloudflare build log, on
      # main (#184).
      #
      # It must follow `ladle:build`: the dry run fails when `assets.directory` does not exist,
      # which is exactly the drift worth catching, and `build/` is what that step writes. Run
      # cold it reads as a broken gate. No credential and no network — `--dry-run` reaches
      # neither, so this works on a forked PR, and metrics are off so a telemetry endpoint
      # cannot make the gate flaky.
      - name: Wrangler config (offline dry run)
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: pnpm check:wrangler

  # This repo has two Cloudflare previews per PR. The URL host tells them apart:
  #   - web   → the Vike app, Workers Builds        (…-wemeditate-web.<acct>.workers.dev)
  #   - ladle → the design system, Workers Builds   (…-wemeditate-design.<acct>.workers.dev)
  # One matrix smoke job runs per target. CF_PROJECT_MATCH selects the right one, by plain
  # substring over the preview host, which carries the Worker's own name — see the ⚠ in
  # wrangler.design.jsonc for what a rename drags with it.
  #
  # require_preview is the per-leg policy: `ladle` reddens when discovery finds nothing, `web`
  # stays lenient. The wemeditate-web Worker's own Builds-trigger branch filters live in
  # Cloudflare and are not readable from here, so reddening that leg could block a PR for a
  # cause nothing in this repo can observe. sydevs/SahajCloud#903 replaces the discovery for
  # both legs, and flipping web strict is this one word.
  smoke:
    name: Smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: web
            project: wemeditate-web
            script: test:smoke
            require_preview: 'false'
          - target: ladle
            project: wemeditate-design
            script: test:smoke:ladle
            # Quoted on purpose. A bare YAML boolean reaches the `if:` below as a value whose
            # type GitHub does not promise, and the string "false" is truthy there — which
            # would redden the web leg for a preview it is not owed.
            require_preview: 'true'
    steps:
      # wemeditate-design rebuilds only when a push touches a path Ladle reads — the Workers Builds
      # trigger's path_includes/path_excludes, mirrored in WATCH/IGNORE below and in the table
      # in docs/cloudflare-previews-ci.md. With no build there is no preview, and discovery
      # would wait out its 12-minute timeout before reporting anyway.
      - name: Did Cloudflare build the ladle preview?
        id: scope
        if: matrix.target == 'ladle' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.action == 'synchronize' && github.event.before || github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          WATCH: '^(components|hooks|lib|layouts|assets|public|types|\.ladle|\.storybook)/|^server/(cms-types|error-utils)|^(package\.json|pnpm-lock\.yaml|tsconfig\.json|\.node-version)$'
          IGNORE: '\.(test\.tsx?|spec\.ts|md)$'
        run: |
          if ! diff=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" --jq '"\(.total_commits) \(.files | length)", .files[].filename'); then
            echo "built=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          read -r commits count <<< "$(head -n 1 <<< "$diff")"
          # Cloudflare ignores watch paths for a push of 0 files or 20+ commits.
          # 300 is the compare API's file cap, so a bigger push counts as built.
          if (( count == 0 || count >= 300 || commits >= 20 )) ||
            tail -n +2 <<< "$diff" | grep -Ev "$IGNORE" | grep -Eq "$WATCH"; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "No path Ladle reads changed in this push, so Cloudflare built no wemeditate-design preview and there is nothing to smoke." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Skip the whole setup with install: setup-node's post step fails the job
      # when it finds no pnpm store to cache.
      - if: steps.scope.outputs.built != 'false'
        uses: actions/checkout@v7
      - if: steps.scope.outputs.built != 'false'
        uses: pnpm/action-setup@v6
      - if: steps.scope.outputs.built != 'false'
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: steps.scope.outputs.built != 'false'
        run: pnpm install --frozen-lockfile

      # Find this target's preview URL through the GitHub API. Cloudflare posts
      # it in the bot's PR comment. Check-run output and deployment data are
      # fallbacks. This step waits until the preview responds, then reports what
      # it found: an empty preview_url and exit 0 when nothing turned up. The
      # step below decides whether that is a failure.
      - name: Discover ${{ matrix.target }} preview URL
        id: preview
        if: steps.scope.outputs.built != 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CF_PROJECT_MATCH: ${{ matrix.project }}
        run: node scripts/get-cloudflare-preview-url.mjs

      - name: Smoke ${{ matrix.target }}
        if: ${{ steps.preview.outputs.preview_url != '' }}
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          # Web specs use this key to find a real SahajCloud page or meditation.
          # It has no effect for ladle.
          SAHAJCLOUD_API_KEY: ${{ secrets.SAHAJCLOUD_API_KEY }}
          TARGET: ${{ matrix.target }}
        # Naming the address is the point, not decoration: it is the only record of WHICH
        # preview a green check read, and the host label is what tells this Worker's preview
        # from anything else answering on the PR. Written before the specs run, so a red
        # check names it too.
        run: |
          {
            echo "### Smoke ($TARGET)"
            echo ""
            echo "Preview address read by discovery: \`$PREVIEW_URL\`"
          } >> "$GITHUB_STEP_SUMMARY"
          pnpm ${{ matrix.script }}

      # A skip must never look like a pass. Discovery exits 0 with an empty URL, and the Smoke
      # step above then does not run at all — so before this step a missing preview was a green
      # check that tested nothing (#184).
      #
      # Three cases stay green, and each is quiet for a reason this step can see:
      #   - built == 'false' — Cloudflare built nothing, so this step is skipped and the scope
      #     step above already said so in the summary.
      #   - merge_group — the queue publishes no preview, and `built` is empty there because the
      #     scope step is gated on `pull_request`. The event is checked in the script rather
      #     than the `if:`, because this case still owes the summary a line; relying on
      #     SAME_REPO evaluating false by accident would be the same verdict for no stated
      #     reason.
      #   - a forked PR — it gets no preview by design, and carries no secrets to get one.
      # Everything else is a same-repo PR that should have had a preview and did not. That is a
      # real failure: the Worker's build did not happen, or discovery read the wrong host.
      - name: Report a missing ${{ matrix.target }} preview
        if: matrix.require_preview == 'true' && steps.scope.outputs.built != 'false' && steps.preview.outputs.preview_url == ''
        env:
          TARGET: ${{ matrix.target }}
          PROJECT: ${{ matrix.project }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          {
            echo "### Smoke ($TARGET)"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$IS_PR" != "true" ]; then
            echo "The merge queue publishes no $PROJECT preview, so there was nothing to smoke." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          MSG="No $PROJECT preview was found for this commit — NO $TARGET smoke specs ran."
          echo "⚠️ $MSG" >> "$GITHUB_STEP_SUMMARY"

          if [ "$SAME_REPO" = "true" ]; then
            echo "::error::$MSG This PR is from the same repository, so the $PROJECT Worker was expected to build one. Read the Cloudflare build log for this commit, and the 'selected …' line in the discovery step above."
            exit 1
          fi
          echo "::warning::$MSG Forked PRs get no preview deployment, so the specs were skipped."

  # Dependency-vulnerability gate. Fails only when this PR ADDS a dependency
  # with a high or critical advisory that reaches production code. An
  # advisory against a dependency already on main fails nothing here: the
  # sydevs loop's daily Dependabot check fixes those, so an unrelated PR is
  # never blocked by something it did not cause. Shared by the sydevs repos;
  # the rules live in
  # sydevs/claude-workflow/.github/workflows/dependency-review.yml.
  dependencies:
    name: Dependency Review
    uses: sydevs/claude-workflow/.github/workflows/dependency-review.yml@main
    permissions:
      contents: read
